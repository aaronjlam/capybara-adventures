<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capy Hero: Coffee Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(27,16,36,0.72); --ink: #FFF4DC; --accent: #FFD23F; --edge: #3A1E12; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #7FB8E6; color: var(--ink); font-family: 'Press Start 2P', 'Courier New', monospace; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; touch-action: none; }

  /* Single slim HUD bar */
  .hud { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 8px; background: var(--panel); border: 3px solid var(--edge); padding: 7px 10px 9px; }
  .hud .hc { display: flex; align-items: center; gap: 6px; }
  .coinIcon { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--edge); display: inline-block; }
  .hearts { color: #FF5C7A; letter-spacing: 1px; }
  .hud button { font-family: inherit; font-size: 8px; background: var(--accent); color: var(--edge); border: 2px solid var(--edge); padding: 4px 6px; cursor: pointer; }
  .cafbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #2E2040; }
  .cafbar > span { position: absolute; inset: 0 auto 0 0; background: #C98650; transition: width 0.2s; }

  /* Touch controls: smaller, see-through, thumb-friendly */





  .tbtn:active { transform: scale(0.95); }
  @media (hover: none) { .tbtn { display: block; } }
  .cut .hud, .cut .tbtn, .cut .hint, .cut .pad { display: none !important; }
  .tbtn { position: fixed; bottom: 12px; width: 58px; height: 58px; border-radius: 50%; z-index: 5; font-family: inherit; font-size: 14px;
    background: rgba(255,244,220,0.35); color: var(--edge); border: 3px solid rgba(58,30,18,0.55); touch-action: none; display: block; }
  @media (hover: hover) { .tbtn { display: none; } }
  .tbtn.jump { right: 12px; width: 76px; height: 76px; background: rgba(255,210,63,0.45); }
  .tbtn.left { left: 12px; }
  .tbtn.right { left: 80px; }
  .mapbox { position: relative; width: 100%; height: 300px; background: linear-gradient(#BFE8FF, #E8FFF0); border: 4px solid var(--edge); }
  .routesvg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .route { fill: none; stroke: #3A1E12; stroke-width: 1.2; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
  .node { position: absolute; transform: translate(-50%, -50%); width: 78px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-family: inherit; font-size: 7px; line-height: 1.5; padding: 5px 4px; background: #FFF4DC; color: var(--edge); border: 3px solid var(--edge); cursor: pointer; }
  .node b { font-size: 11px; }
  .node.locked { opacity: 0.5; cursor: not-allowed; }
  .node em { font-style: normal; color: #C98650; }
  .blimp { position: absolute; transform: translate(-50%, -50%); font-size: 22px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -62%); } }
  .gcard { width: 100%; border: 4px solid var(--edge); background: #FFF4DC; color: var(--edge); padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .gcard .small { color: var(--edge); }
  .gpic { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  .gcard.locked { opacity: 0.6; }
  .glock { font-size: 28px; padding: 18px 0; }
  .cutnext { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 12; display: none; font-size: 11px; padding: 12px 22px; }
  .cutshow .cutnext { display: block; }
  .cutskip { position: fixed; top: 12px; right: 12px; z-index: 12; display: none; font-size: 8px; padding: 8px; }
  .cut .cutskip { display: block; }
  .hint { position: fixed; left: 8px; bottom: 8px; z-index: 5; font-size: 7px; background: var(--panel); border: 3px solid var(--edge); padding: 6px 8px; }
  @media (hover: none) { .hint { display: none; } }

  /* Overlays: title, stage select, intro, pause, clear, game over */
  .overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(27,16,36,0.8); }
  .overlay.show { display: flex; }
  .panel > * { flex-shrink: 0; }
  .backbtn { position: sticky; bottom: -22px; z-index: 3; box-shadow: 0 -10px 0 #241632, 4px 4px 0 var(--edge); }
  .menugrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .menugrid .btn { font-size: 8px; padding: 10px 6px; line-height: 1.6; }
  .panel { width: min(94vw, 460px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; font-size: 11px; line-height: 1.7;
    background: #241632; border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--edge); padding: 22px 16px; max-height: 92vh; overflow: auto; }
  .logo { font-size: 22px; line-height: 1.4; text-shadow: 4px 4px 0 var(--edge); color: var(--accent); }
  .small { font-size: 8px; color: #CDBEE6; line-height: 1.9; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .btn { font-family: inherit; font-size: 10px; padding: 12px 10px; background: var(--accent); color: var(--edge);
    border: 4px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); cursor: pointer; }
  .btn.alt { background: #FFF4DC; }
  .btn:disabled { background: #4A3C5C; color: #8A7CA0; box-shadow: none; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--edge); }
  .btn.wide { width: 100%; }
</style>
</head>
<body>

<div class="hud" id="hud">
  <span id="hStage">1-1 COFFEE RUN</span>
  <span class="hc"><i class="coinIcon"></i><span id="coins">0</span></span>
  <span class="hc">SCORE <span id="score">0</span></span>
  <span class="hearts" id="hearts">♥♥♥</span>
  <span id="pw" style="color:#FFB347"></span>
  <button data-act="pause" id="pauseBtn">II</button>
  <div class="cafbar"><span id="caf" style="width:100%"></span></div>
</div>

<canvas id="game"></canvas>

<button class="tbtn left" id="tL" aria-label="Left">◀</button>
<button class="tbtn right" id="tR" aria-label="Right">▶</button>
<button class="tbtn jump" id="tJ" aria-label="Jump">JUMP</button>
<button class="btn cutnext" id="cutNext">NEXT ▶</button>
<button class="btn alt cutskip" id="cutSkip">SKIP</button>
<div class="hint">Arrows / A D move · SPACE or K jump · UP climb vines · P or ESC pause</div>

<div class="overlay" id="overlay"></div>

    const b = e.target.closest("[data-act]");

    ensureAudio();
    act(b.dataset.act, b.dataset.arg);
  });
  document.getElementById("pauseBtn").addEventListener("click", () => { ensureAudio(); togglePause(); });

  // ---------- Story: intro cutscene and ending ----------
  const STORY = [
    "The blimp is leaving the Royal Garden. Chase it through the city!",
    "Jax's blimp is flying over the misty marsh. Don't fall in!",
    "The blimp climbs over the sunrise hills. Keep up!",
    "Jax drifts above the festival grounds. Stay close!",
    "Deep in the jungle, Jax is heading for his hideout.",
    "The final chase: over the rooftops of Thorn Castle!"
  ];
  let cut = null;

  const CH = 1.7;   // story characters are drawn this much larger
  function scaleFor(w, h) { return Math.min(w / 360, h / 620) * 1.3; }
  function withScale(x, y, sc, fn) { g.save(); g.translate(x, y); g.scale(sc, sc); fn(); g.restore(); }
  function bgGrad(c1, c2, h) { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, c1); gr.addColorStop(1, c2); return gr; }
  function bubble(x, y, text) {
    g.font = "14px 'Press Start 2P', monospace";
    const tw = g.measureText(text).width + 20;
    g.fillStyle = "#FFF4DC"; g.strokeStyle = "#3A1E12"; g.lineWidth = 3;
    g.fillRect(x - tw / 2, y - 30, tw, 30); g.strokeRect(x - tw / 2, y - 30, tw, 30);
    g.beginPath(); g.moveTo(x - 5, y); g.lineTo(x, y + 9); g.lineTo(x + 5, y); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#E0584A"; g.textAlign = "center"; g.fillText(text, x, y - 9); g.textAlign = "left";
  }

  // Jaguar Jax's blimp, with Jax in the gondola
  function blimpSprite(x, y, sc, jag) {
    g.save(); g.translate(x, y); g.scale(sc, sc);
    g.save();
    g.beginPath(); g.ellipse(0, 0, 60, 26, 0, 0, Math.PI * 2); g.clip();
    g.fillStyle = "#F4E7C5"; g.fillRect(-60, -26, 120, 52);
    g.fillStyle = "#E0734A";
    for (let i = -3; i <= 3; i += 2) g.fillRect(i * 10 - 5, -26, 10, 52);
    g.restore();
    g.fillStyle = "#B2502E"; g.beginPath(); g.moveTo(-56, -6); g.lineTo(-76, -24); g.lineTo(-76, 16); g.lineTo(-56, 6); g.fill();
    g.strokeStyle = "#5A3A22"; g.lineWidth = 2; g.beginPath(); g.moveTo(-14, 26); g.lineTo(-16, 36); g.moveTo(14, 26); g.lineTo(16, 36); g.stroke();
    g.fillStyle = "#5A3A22"; g.fillRect(-24, 36, 48, 14);
    if (jag) {
      g.fillStyle = "#D98F2B"; g.beginPath(); g.arc(0, 42, 9, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(-7, 34, 3, 0, Math.PI * 2); g.arc(7, 34, 3, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#FFD23F"; g.fillRect(-5, 40, 3, 2); g.fillRect(2, 40, 3, 2);
      g.fillStyle = "#1B1024"; g.fillRect(-1, 45, 2, 2);
    }
    g.restore();
  }

  // Princess Lila in her royal dress (drawn at her feet)
  function drawPrincess(t) {
    const b = Math.sin(t / 12) * 1.2;
    g.fillStyle = "#E879B7"; g.beginPath(); g.moveTo(-26, 0); g.lineTo(26, 0); g.lineTo(14, -34 + b); g.lineTo(-14, -34 + b); g.fill();
    g.fillStyle = "#FFD1E8"; g.fillRect(-10, -30 + b, 20, 4);
    g.fillStyle = "#E3A36B"; g.beginPath(); g.ellipse(0, -42 + b, 14, 10, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(0, -62 + b, 14, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(-11, -74 + b, 4, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#8A5330"; g.beginPath(); g.ellipse(7, -58 + b, 6, 7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#1B1024"; g.fillRect(-4, -66 + b, 3, 3);
    g.fillStyle = "#FF9AC1"; g.fillRect(-8, -56 + b, 4, 2);
    g.fillStyle = "#FFD23F"; g.fillRect(-10, -78 + b, 20, 6);
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 7 - 3, -78 + b); g.lineTo(i * 7, -89 + b); g.lineTo(i * 7 + 3, -78 + b); g.fill(); }
  }

  // Golden harp she plays
  function drawHarp(t) {
    g.strokeStyle = "#D4A74A"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(22, 0); g.quadraticCurveTo(46, -40, 28, -70); g.stroke();
    g.strokeStyle = "rgba(255,240,200,0.95)"; g.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const x = 28 + i * 3, top = -66 + i * 4, off = Math.sin(t / 5 + i * 1.3) * 1.6;
      g.beginPath(); g.moveTo(x, -4); g.lineTo(x + off, top); g.stroke();
    }
  }

  // Capy as a sprite frame (sitting or standing)
  function drawCapy(img, x, y, sc, squash = 1) {
    const dh = 66 * sc * squash, dw = dh * (88 / 118);
    g.drawImage(img, x - dw / 2, y - dh, dw, dh);
  }

  function sceneGarden(t, dur, w, h) {
    const sc = scaleFor(w, h), gy = h * 0.66;
    g.fillStyle = bgGrad("#FFE7B8", "#F7B8D0", gy); g.fillRect(0, 0, w, gy);
    g.fillStyle = "#7BC46A"; g.fillRect(0, gy, w, h - gy);
    g.fillStyle = "#3F8E3A";
    for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(i * w / 8, gy, 30 * sc / 1.3 * CH, Math.PI, 0); g.fill(); }
    // Fountain with rising sparkles
    const fx = w * 0.82, fy = gy + 30 * sc / 1.3 * CH;
    g.fillStyle = "#9AD8F0"; g.beginPath(); g.ellipse(fx, fy, 40 * sc / 1.3 * CH, 10 * sc / 1.3 * CH, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#E6F8FF";
    for (let k = 0; k < 10; k++) { const ph = (t / 25 + k / 10) % 1; g.fillRect(fx + Math.sin(k * 2.1) * 10 * ph - 1, fy - 6 - ph * 36 * sc / 1.3 * CH, 3, 3); }
    // Princess playing the harp, music notes drifting up
    const px = w * 0.38, py = gy + 40 * sc / 1.3 * CH;
    withScale(px, py, sc / 1.3 * CH, () => { drawHarp(t); drawPrincess(t); });
    for (let i = 0; i < 4; i++) {
      const ph = ((t + i * 40) % 160) / 160;
      g.globalAlpha = 1 - ph; g.fillStyle = "#7A3B8E";
      g.font = "14px 'Press Start 2P', monospace";
      g.fillText("♪", px + 30 + i * 10 + Math.sin(ph * 6 + i) * 8, py - 70 - ph * 90);
    }
    g.globalAlpha = 1;
  }

  // Jax swoops in, the princess is snatched and dangles from the rope, then she screams
  function sceneKidnap(t, dur, w, h) {
    const sc = scaleFor(w, h), gy = h * 0.72;
    g.fillStyle = bgGrad("#FFB38A", "#6A4C9C", gy); g.fillRect(0, 0, w, gy);
    g.fillStyle = "#7BC46A"; g.fillRect(0, gy, w, h - gy);
    const k = Math.min(1, t / 120);
    const bx = w * (1.2 - 0.6 * k), by = h * (0.2 + 0.03 * Math.sin(t / 20));
    blimpSprite(bx, by, sc * 0.7, true);
    const px = bx - 6 * sc, py = by + 130 * sc * 0.9 + Math.sin(t / 10) * 3;
    g.strokeStyle = "#3A1E12"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(bx, by + 46 * sc * 0.9); g.lineTo(px, py - 66 * sc * 0.85); g.stroke();
    withScale(px, py, sc * 0.85, () => drawPrincess(t));
    if (t >= 120) bubble(px - 95 + Math.sin(t) * 3, py - 60 * sc * 0.85, "HELP!");
  }

  // Capy sits cross-legged in the meadow until the cry for help reaches him
  function sceneMeadow(t, dur, w, h) {
    const sc = scaleFor(w, h), gy = h * 0.7;
    g.fillStyle = bgGrad("#BFE8FF", "#E8FFF0", gy); g.fillRect(0, 0, w, gy);
    g.fillStyle = "#7BC46A"; g.fillRect(0, gy, w, h - gy);
    g.strokeStyle = "#5DA84E"; g.lineWidth = 2;
    for (let i = 0; i < 40; i++) { const x = (i * 53) % w; g.beginPath(); g.moveTo(x, gy + 10 + (i % 5) * 18); g.lineTo(x - 3, gy + 4 + (i % 5) * 18); g.stroke(); }
    const cx = w * 0.42, cy = gy + 40 * sc / 1.3 * CH;
    const breathe = 1 + Math.sin(t / 25) * 0.02;
    drawCapy(walkImgs[0], cx, cy, sc / 1.3 * CH, 0.72 * breathe);
    // Snoozing "z" bubbles
    g.fillStyle = "#3A1E12"; g.font = "10px 'Press Start 2P', monospace";
    for (let i = 0; i < 3; i++) { const ph = ((t + i * 50) % 150) / 150; g.globalAlpha = 1 - ph; g.fillText("z", cx + 20 + i * 8 + ph * 10, cy - 60 - ph * 40); }
    g.globalAlpha = 1;
    if (t >= 110) {
      const bx = w * 0.82 - (t - 110) * 0.2, by = h * 0.2;
      blimpSprite(bx, by, sc * 0.5, true);
      if (t >= 130) bubble(bx - 20 + Math.sin(t) * 2, by + 46 * sc * 0.5, "HELP!");
    }
    if (t >= 150) {
      g.fillStyle = "#FF5C7A"; g.font = "16px 'Press Start 2P', monospace";
      g.fillText("!", cx - 4 + Math.sin(t) * 2, cy - 70 * sc / 1.3 * CH);
    }
  }

  // Capy jumps up and sprints after the blimp
  function sceneWake(t, dur, w, h) {
    const sc = scaleFor(w, h), gy = h * 0.7;
    g.fillStyle = bgGrad("#BFE8FF", "#E8FFF0", gy); g.fillRect(0, 0, w, gy);
    g.fillStyle = "#7BC46A"; g.fillRect(0, gy, w, h - gy);
    const span = w + 260;
    const bx = ((w * 0.75 + t * 2.2) % span) - 80, by = h * 0.2 + Math.sin(t / 30) * 6;
    blimpSprite(bx, by, sc * 0.5, true);
    let x = w * 0.3, y = gy + 40 * sc / 1.3 * CH, img = walkImgs[0];
    if (t < 30) { y -= Math.sin((t / 30) * Math.PI) * 80; img = jumpImg; }
    else { x = ((w * 0.3 + (t - 30) * 2.2) % span) - 80; img = runImgs[Math.floor(t / 4) % 3]; }
    if (t >= 30) for (let i = 0; i < 3; i++) { g.fillStyle = `rgba(255,255,255,${0.5 - i * 0.15})`; g.beginPath(); g.arc(x - 20 - i * 10, y - 4, 4 + i, 0, Math.PI * 2); g.fill(); }
    drawCapy(img, x, y, sc / 1.3 * CH);
  }

  // Ending: Capy reaches the castle as the blimp lands
  function sceneGate(t, dur, w, h) {
    const sc = scaleFor(w, h), gy = h * 0.72;
    g.fillStyle = bgGrad("#2A1B3D", "#FF9E7A", gy); g.fillRect(0, 0, w, gy);
    g.fillStyle = "#3F4A3A"; g.fillRect(0, gy, w, h - gy);
    g.fillStyle = "#4A4060"; g.fillRect(w * 0.6, gy - 150 * sc / 1.3 * CH, w * 0.4, 150 * sc / 1.3 * CH);
    for (let i = 0; i < 3; i++) g.fillRect(w * (0.6 + i * 0.14), gy - 170 * sc / 1.3 * CH, 20 * sc / 1.3 * CH, 22 * sc / 1.3 * CH);
    g.fillStyle = "#1B1024"; g.beginPath(); g.arc(w * 0.8, gy, 30 * sc / 1.3 * CH, Math.PI, 0); g.fill(); g.fillRect(w * 0.8 - 30 * sc / 1.3 * CH, gy, 60 * sc / 1.3 * CH, 40 * sc / 1.3 * CH);
    const land = Math.min(1, t / 160);
    const bx = w * (0.95 - 0.25 * land), by = h * (0.2 + 0.4 * land);
    blimpSprite(bx, by, sc * 0.5, true);
    const x = Math.min(w * 0.3 + t * 1.1, w * 0.62), y = gy + 40 * sc / 1.3 * CH;
    drawCapy(runImgs[Math.floor(t / 5) % 3], x, y, sc / 1.3 * CH);
  }

  // Reunion: Princess Lila runs to Capy, hearts float up
  function sceneReunion(t, dur, w, h) {
    const sc = scaleFor(w, h), gy = h * 0.7;
    g.fillStyle = bgGrad("#FFE7B8", "#F7B8D0", gy); g.fillRect(0, 0, w, gy);
    g.fillStyle = "#7BC46A"; g.fillRect(0, gy, w, h - gy);
    const cx = w * 0.4, cy = gy + 40 * sc / 1.3 * CH;
    const px = Math.max(w * 0.62, w * 0.8 - t * 1.2), py = cy;
    drawCapy(walkImgs[0], cx, cy, sc / 1.3 * CH, 1 + Math.sin(t / 8) * 0.03);
    withScale(px, py, sc / 1.3 * CH, () => drawPrincess(t));
    g.font = "12px 'Press Start 2P', monospace";
    for (let i = 0; i < 6; i++) {
      const ph = ((t + i * 30) % 180) / 180;
      g.globalAlpha = 1 - ph; g.fillStyle = "#FF5C7A";
      g.fillText("♥", w * (0.3 + i * 0.1) + Math.sin(ph * 6 + i) * 10, cy - 90 - ph * 120);
    }
    g.globalAlpha = 1;
  }

  // The end card
  function sceneEnd(t, dur, w, h) {
    g.fillStyle = "#1B1024"; g.fillRect(0, 0, w, h);
    const pulse = 0.85 + Math.sin(t / 15) * 0.15;
    g.globalAlpha = pulse; g.fillStyle = "#FFD23F";
    g.font = `${Math.round(Math.min(w / 14, 26))}px 'Press Start 2P', monospace`; g.textAlign = "center";
    g.fillText("THE END", w / 2, h * 0.42);
    g.globalAlpha = 1; g.textAlign = "left";
  }

  const INTRO_SCENES = [
    { dur: 330, text: "In the Royal Garden, Princess Lila played her golden harp...", draw: sceneGarden },
    { dur: 360, text: "Suddenly, Jaguar Jax swooped in on a flying blimp and snatched her away!", draw: sceneKidnap },
    { dur: 300, text: "\"HELP! CAPY!\" The cry echoed across the meadow where Capy was meditating.", draw: sceneMeadow },
    { dur: 220, text: "Capy leapt to his feet and chased the blimp!", draw: sceneWake }
  ];
  const ENDING_SCENES = [
    { dur: 300, text: "Capy reached Thorn Castle just as Jax's blimp landed.", draw: sceneGate },
    { dur: 300, text: "\"You saved me, Capy!\" said Princess Lila.", draw: sceneReunion },
    { dur: 240, text: "Princess Lila is safe. The Royal Garden is peaceful once again.", draw: sceneEnd }
  ];

  // Storybook pages: each part opens under a parchment cover. Tap to open, the picture
  // and text appear, and the NEXT button moves on to the next part.
  const TITLES = {
    intro: ["The Royal Garden", "The Kidnapping", "The Call for Help", "The Chase Begins"],
    ending: ["Thorn Castle", "A Happy Reunion", "The End"]
  };

  function startCut(kind) {
    cut = { kind, i: 0, t: 0, scenes: kind === "intro" ? INTRO_SCENES : ENDING_SCENES, open: false, chars: 0 };
    mode = "cutscene"; keys = {}; closeOv();
  }
  function openPage() { cut.open = true; cut.t = 0; cut.chars = 0; }
  function typingDone() { return cut.chars >= cut.scenes[cut.i].text.length; }
  function finishCut() {
    const kind = cut.kind; cut = null;
    if (kind === "intro") { save.seenStory = true; persist(); loadStage(Math.min(save.unlocked, STAGES.length) - 1); }
    else showEnd();
  }
  function skipCut() { if (mode === "cutscene" && cut) finishCut(); }
  function nextPart() {
    if (!cut) return;
    if (cut.i >= cut.scenes.length - 1) { finishCut(); return; }
    cut.i++; cut.open = false; cut.t = 0; cut.chars = 0;
  }
  // Tap: open the page, or finish the text if it is still being written
  function tapStory() {
    if (!cut) return;
    if (!cut.open) openPage();
    else if (!typingDone()) cut.chars = 1e9;
  }

  function cutUpdate() {
    if (!cut) return;
    cut.t++;
    if (cut.open && !typingDone()) cut.chars += 1.2;
    document.body.classList.toggle("cutshow", !!cut.open);
  }

  function drawCover(w, h, i, n) {
    g.fillStyle = bgGrad("#F3E2B8", "#E6CC94", h); g.fillRect(0, 0, w, h);
    g.strokeStyle = "#3A1E12"; g.lineWidth = 4; g.strokeRect(16, 16, w - 32, h - 32);
    g.lineWidth = 1; g.strokeRect(26, 26, w - 52, h - 52);
    g.fillStyle = "#8A5330";
    for (const [x, y] of [[40, 40], [w - 40, 40], [40, h - 40], [w - 40, h - 40]]) { g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#3A1E12"; g.textAlign = "center";
    g.font = "10px 'Press Start 2P', monospace";
    g.fillText(`PART ${i + 1} OF ${n}`, w / 2, h * 0.36);
    g.font = `${Math.round(Math.min(w / 19, 20))}px 'Press Start 2P', monospace`;
    g.fillText(TITLES[cut.kind][i], w / 2, h * 0.46);
    if (Math.floor(performance.now() / 500) % 2 === 0) {
      g.font = "9px 'Press Start 2P', monospace";
      g.fillText("TAP TO OPEN THE PAGE", w / 2, h * 0.7);
    }
    g.textAlign = "left";
  }

  // Text is typed out letter by letter, shown above the NEXT button
  function subtitleTyped(text, w, h) {
    g.font = "10px 'Press Start 2P', monospace";
    const maxW = w - 70, words = text.split(" "), lines = []; let line = "";
    for (const wd of words) {
      const trial = line ? line + " " + wd : wd;
      if (g.measureText(trial).width > maxW && line) { lines.push(line); line = wd; } else line = trial;
    }
    if (line) lines.push(line);
    const bh = 28 + lines.length * 18, by = h - bh - 84;
    g.fillStyle = "rgba(27,16,36,0.86)"; g.fillRect(20, by, w - 40, bh);
    g.strokeStyle = "#3A1E12"; g.lineWidth = 4; g.strokeRect(20, by, w - 40, bh);
    g.fillStyle = "#FFF4DC";
    let remaining = Math.floor(cut.chars);
    lines.forEach((l, i) => {
      g.fillText(l.slice(0, Math.max(0, remaining)), 36, by + 28 + i * 18);
      remaining -= l.length + 1;
    });
  }

  function cutDraw() {
    const w = window.innerWidth, h = window.innerHeight;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, w, h);
    if (!cut.open) { drawCover(w, h, cut.i, cut.scenes.length); return; }
    const sc = cut.scenes[cut.i];
    sc.draw(cut.t, 0, w, h);
    const fade = 1 - Math.min(1, cut.t / 25);     // the picture fades in as the page opens
    if (fade > 0) { g.fillStyle = `rgba(20,10,30,${fade})`; g.fillRect(0, 0, w, h); }
    subtitleTyped(sc.text, w, h);
  }

  function drawChaseBlimp() {
    if (si === 0 || si >= 6 || boss) return;   // no chase blimp on stage 1, in secret rooms, or once Jax appears
    const bx = cam + VIEW_W - 70 + Math.sin(frame / 90) * 6;
    const by = -OY + 100 / S + Math.sin(frame / 50) * 3;
    blimpSprite(bx, by, 0.45, true);
    g.fillStyle = "rgba(255,255,255,0.7)";
    g.beginPath(); g.arc(bx - 78, by + 2, 4, 0, Math.PI * 2); g.arc(bx - 92, by + 3, 3, 0, Math.PI * 2); g.fill();
  }

  function showEnd() {
    mode = "clear"; runScore = 0; coinCount = 0;
    openOv(`<div class="panel"><div class="logo">THE END</div><div>Princess Lila is safe!</div>
      <div class="small">Score: ${score} · Best: ${save.best}</div>
      <button class="btn wide" data-act="stage" data-arg="0">PLAY AGAIN</button>
      <button class="btn alt wide" data-act="title">TITLE</button></div>`);
  }

  function loop() {
    try {
      if (mode === "cutscene") { cutUpdate(); if (cut) cutDraw(); }
      else if (hitStop > 0) { hitStop--; draw(); }
      else { update(); draw(); }
      document.body.classList.toggle("cut", mode === "cutscene");
      if (mode !== "cutscene") document.body.classList.remove("cutshow");
    } catch (err) {
      console.error("Frame error:", err);
    }
    requestAnimationFrame(loop);   // always keep the loop running
  }

  // ---------- Stage loading ----------
  function starStr(n) { return "★".repeat(n) + "☆".repeat(3 - n); }

  function loadStage(i, back) {
    si = i;
    const s = STAGES[i];
    const st = back && stash ? stash : null;
    if (st) stash = null;
    if (st) {
      p = { ...st.p, x: st.doorX + 40, y: GY - PH, vx: 0, vy: 0, on: false, climb: false, grabLock: 0, inv: 60 };
      enemies = st.enemies; coinsL = st.coinsL; plats = st.plats; balloons = st.balloons; cups = st.cups;
      cps = st.cps; powItems = st.powItems; ribItems = st.ribItems; checkpointX = st.checkpointX; stageHits = st.stageHits;
      vines = s.vines || [];
      cam = Math.max(0, Math.min(s.len - VIEW_W, p.x - VIEW_W / 2));
    } else {
      p = { x: 40, y: GY - PH, vx: 0, vy: 0, on: false, face: 1, inv: 0, climb: false, walkDist: 0, running: false, sq: 1, grabLock: 0, espresso: 0, shield: false, charm: false };
      cam = 0; checkpointX = 40; stageHits = 0; caf = 100;
      if (i < 6 || lives <= 0) lives = DIFF().lives;
      enemies = [...s.enemies, ...(EXTRA[i] || [])].map(e => ({ ...e, v: e.v * DIFF().speed, dir: 1, dead: false, y0: e.y }));
      coinsL = s.coins.map(c => ({ x: c[0], y: c[1], got: false }));
      plats = [
      ...s.plats.map(q => ({ x: q[0], y: q[1], w: q[2], sink: !!q[3], t: 0, gone: false, g2: 0 })),
      ...(MOVERS[i] || []).map(m => ({ x: m.x, y: m.y, w: m.w, sink: false, t: 0, gone: false, g2: 0, mv: true, px: m.x, x0: m.x0, x1: m.x1, v: m.v, dir: 1 })),
      ...(CRUMBLE[i] || []).map(c => ({ x: c.x, y: c.y, w: c.w, sink: true, crumble: true, t: 0, gone: false, g2: 0 }))
    ];
      balloons = (s.balloons || []).map(b => ({ x: b[0], y: b[1], bt: 0 }));
      cups = (s.cups || []).map(c => ({ x: c[0], y: c[1], got: false }));
      cps = (s.cps || []).map(x => ({ x, hit: false }));
      vines = s.vines || [];
      powItems = (POWERS[i] || []).map(([k, x, y]) => ({ k, x, y, got: false }));
      ribItems = (s.ribbons || []).map(([x, y], k) => ({ k: i + "-" + k, x, y, got: !!save.rib[i + "-" + k] }));
    }
    geysers = GEYSERS[i] || [];
    bombs = []; boss = null;
    parts = []; jumpBuf = 0; coyote = 0; toast = null; keys = {};
    score = st ? score : runScore; combo = 0; popups = []; rings = []; trail = [];
    updateHud();
    if (st) { mode = "play"; closeOv(); return; }
    if (i < 6) { mode = "intro"; openOv(introHTML(i)); }
    else { mode = "play"; closeOv(); toast = { text: "SECRET ROOM!", t: 90 }; }
  }

  // Walk into the secret cellar: the current stage is kept so Capy can come back to the same door
  function enterBonus() {
    stash = { si, p: { ...p }, doorX: p.x, enemies, coinsL, plats, balloons, cups, cps, powItems, ribItems, checkpointX, stageHits };
    runScore = score;
    loadStage(6 + si);
  }
  function returnFromBonus() {
    const k = stash ? stash.si : Math.max(0, si - 6);
    runScore = score;
    loadStage(k, true);
  }

  // ---------- Gameplay ----------
  function hurt() {
    if (p.inv > 0) return;
    if (p.shield) {
      p.shield = false; p.inv = 60; shake = 6;
      sfx("hurt"); burst(p.x + PW / 2, p.y + PH / 2, "#FF9A3C", 14);
      addPopup(p.x + PW / 2, p.y - 10, "SHIELD BLOCKED!", "#FF9A3C", 1);
      return;
    }
    lives--;
    p.inv = 90; shake = 12; flashT = 14; stageHits++;
    sfx("hurt");
    burst(p.x + PW / 2, p.y + PH / 2, "#FF5C7A", 10);
    vibrate(60);
    if (lives <= 0) {
      mode = "over";
      openOv(`<div class="panel"><div class="logo">GAME OVER</div><div class="small">Your caffeine ran out.</div>
        <button class="btn wide" data-act="retry">RETRY STAGE</button>
        <button class="btn alt wide" data-act="title">TITLE</button></div>`);
    }
  }

  function fall() { hurt(); p.x = checkpointX; p.y = GY - PH; p.vy = 0; p.climb = false; p.pounding = false; }
  function land(y) {
    const pounded = p.pounding;
    p.pounding = false; p.y = y - PH; p.vy = 0; p.on = true; combo = 0;
    if (pounded) groundPound();
  }

  function completeStage() {
    if (STAGES[si].bonus) { returnFromBonus(); return; }
    mode = "clear";
    sfx("clear");
    const cols = ["#FF5C7A", "#FFD23F", "#5BE37A", "#59C9FF", "#FFFFFF"];
    for (let i = 0; i < 70; i++) parts.push({ x: STAGES[si].goal + 10, y: GY - 140, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 8 - 2,
      life: 90, max: 90, c: cols[i % 5], star: i % 2 === 0 });
    save.unlocked = Math.max(save.unlocked, Math.min(6, si + 2));
    runScore = score; save.best = Math.max(save.best || 0, score);
    const gotCoins = coinsL.filter(c => c.got).length, totalCoins = coinsL.length;
    const stars = 1 + (totalCoins && gotCoins >= totalCoins * 0.7 ? 1 : 0) + (stageHits === 0 ? 1 : 0);
    save.stars = save.stars || {}; save.stars[si] = Math.max(save.stars[si] || 0, stars); persist();
    persist();
    const last = si === 5;
    if (last) {
      startCut("ending");
    } else {
      const next = STAGES[si + 1];
      openOv(`<div class="panel"><div class="logo">${STAGES[si].name.toUpperCase()} CLEAR</div>
        <div class="logo">${starStr(stars)}</div>
        <div>Score: ${score}</div><div>Next up: ${next.name}</div><div class="small">${next.sub}</div>
        <button class="btn wide" data-act="next">NEXT STAGE</button>
        <button class="btn alt wide" data-act="title">TITLE</button></div>`);
    }
  }

  function burst(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3 - 1, life: 30, c: color });
  }

  function update() {
    if (mode !== "play") return;
    frame++;
    const s = STAGES[si];
    const prevBottom = p.y + PH;
    const wasOn = p.on;

    if (p.inv > 0) p.inv--;
    if (p.espresso > 0) p.espresso--;
    if (s.theme === "rooftop") windDir = Math.round(Math.sin(frame / 240)); else windDir = 0;
    if (s.theme === "sun") caf = Math.max(0, caf - 0.03);

    // Walk 40 pixels and Capy dashes
    const dirKey = keys.left ? -1 : keys.right ? 1 : 0;
    updateIdle(dirKey);
    if (!dirKey || dirKey !== p.face) { p.walkDist = 0; p.running = false; }
    if (dirKey && p.on) p.walkDist += SPD;
    if (dirKey && p.walkDist >= DASH_AT) p.running = true;
    let spd = p.running ? SPD * 2 : SPD;
    if (p.espresso > 0) spd *= 1.8;
    if (s.theme === "sun" && caf <= 0) spd *= 0.5;
    p.vx = 0;
    if (dirKey) { p.vx = dirKey * spd; p.face = dirKey; }
    if (windDir) p.vx += windDir * 0.5;
    if (keys.jumpPressed && p.on && s.door !== undefined && Math.abs(p.x + PW / 2 - s.door) < 18) { keys.jumpPressed = false; enterBonus(); return; }
    if (keys.downPressed) { keys.downPressed = false; if (!p.on && !p.climb && !p.pounding) startPound(); }
    if (keys.jumpPressed && !p.on && coyote === 0 && !p.climb && !p.pounding && p.vy > -1) { startPound(); keys.jumpPressed = false; }
    if (keys.jumpPressed) { jumpBuf = BUFFER; keys.jumpPressed = false; }
    if (jumpBuf > 0) jumpBuf--;
    if (p.on) coyote = COYOTE; else if (coyote > 0) coyote--;

    // Vines
    const cxMid = p.x + PW / 2;
    const vine = vines.find(v => Math.abs(cxMid - v[0]) < 12 && p.y + PH > v[1] && p.y < v[2]);
    if (p.grabLock > 0) p.grabLock--;
    if (!p.climb && vine && (keys.up || p.charm || touch) && p.grabLock === 0) p.climb = true;

    // Jump (buffered, with coyote time)
    if (p.climb && jumpBuf > 0) {
      p.climb = false; p.grabLock = 40; p.vy = JUMP * 0.8; jumpBuf = 0; coyote = 0; p.on = false; sfx("jump");
      p.sq = 1.25; burst(p.x + PW / 2, p.y + PH, "#E8DCC8", 5);
    } else if (!p.climb && jumpBuf > 0 && (p.on || coyote > 0)) {
      p.vy = JUMP; jumpBuf = 0; coyote = 0; p.on = false; sfx("jump");
      p.sq = 1.25; burst(p.x + PW / 2, p.y + PH, "#E8DCC8", 5);
    }

    // Music speeds up near the goal and during the boss fight
    musicInterval = boss && boss.hp > 0 ? 125 : (s.goal - p.x < 350 ? 160 : 200);
    // The boss arena starts when Capy reaches it
    if (ARENA[si] !== undefined && !boss && p.x >= ARENA[si]) startBoss();
    if (boss) updateBoss(prevBottom);

    // Moving platforms move, and carry Capy if he is standing on one
    for (const pl of plats) if (pl.mv) { pl.px = pl.x; pl.x += pl.v * pl.dir; if (pl.x < pl.x0 || pl.x > pl.x1) pl.dir *= -1; }
    if (p.onPlat && p.on && !p.climb) p.x += p.onPlat.x - p.onPlat.px;

    // Geysers erupt on a timer and push Capy up while they blow
    for (const gz of geysers) {
      const ph = (frame + gz.off) % 240;
      gz.active = ph >= 160 && ph < 220;
      if (gz.active && Math.abs(p.x + PW / 2 - gz.x) < 16 && !p.climb) {
        p.vy = Math.min(p.vy, -9.5); p.on = false; p.sq = 1.15;
        if (frame % 8 === 0) burst(gz.x, GY - 10, "#BFEFFF", 3);
      }
    }

    // Physics
    if (p.climb) {
      p.vy = 0; p.vx = 0;
      p.y += keys.down ? 2 : (keys.up || p.charm || touch) ? -2 : 0;
      if (vine && p.y + PH <= vine[1] + 4) { p.climb = false; land(vine[1]); }
      if (!vine) p.climb = false;
    } else {
      p.vy += GRAV;
      p.y += p.vy;
    }
    p.x += p.vx;
    p.x = Math.max(0, Math.min(s.len, p.x));

    // Collisions
    p.on = false;
    let standingPad = null;
    const bottom = p.y + PH, cx = p.x + PW / 2;
    if (!p.climb) {
      if (!inPit(cx) && prevBottom <= GY && bottom >= GY && p.vy >= 0) land(GY);
      for (const pl of plats) {
        if (pl.gone) continue;
        if (prevBottom <= pl.y && bottom >= pl.y && p.vy >= 0 && p.x + PW > pl.x && p.x < pl.x + pl.w) { land(pl.y); standingPad = pl; }
      }
      for (const b of balloons) {
        const by = b.y - 14;
        if (prevBottom <= by && bottom >= by && p.vy >= 0 && p.x + PW > b.x - 14 && p.x < b.x + 14) {
          p.y = by - PH; p.vy = JUMP * 1.35; p.on = false; b.bt = 20;
          sfx("bounce"); burst(b.x, by, "#FF5C7A", 6);
        }
      }
    }
    p.onPlat = standingPad && standingPad.mv ? standingPad : null;
    if (p.on && !wasOn) { p.sq = 0.75; burst(p.x + PW / 2, p.y + PH, "#E8DCC8", 4); }

    // Sinking lily pads
    for (const pl of plats) {
      if (!pl.sink) continue;
      if (pl.gone) { pl.g2--; if (pl.g2 <= 0) { pl.gone = false; pl.t = 0; } continue; }
      if (pl === standingPad) { pl.t++; if (pl.t > (pl.crumble ? 25 : 40)) { pl.gone = true; pl.g2 = 150; } }
      else if (pl.t > 0) pl.t--;
    }
    for (const b of balloons) if (b.bt > 0) b.bt--;

    if (p.y > H) fall();

    // Checkpoints
    for (const cp of cps) {
      if (!cp.hit && p.x >= cp.x) {
        cp.hit = true; checkpointX = cp.x;
        sfx("checkpoint"); burst(cp.x, GY - 40, "#7BFF9A", 12);
        toast = { text: "CHECKPOINT", t: 90 };
      }
    }

    // Pickups
    for (const c of coinsL) {
      if (!c.got && Math.abs(c.x - cxMid) < 18 && Math.abs(c.y - (p.y + PH / 2)) < 26) {
        c.got = true; coinCount++; save.coins = (save.coins || 0) + 1; persist(); addScore(10); sfx("coin"); burst(c.x, c.y, "#FFD23F", 6);
        addRing(c.x, c.y, "#FFD23F"); addPopup(c.x, c.y - 10, "+10", "#FFD23F", 0.8);
      }
    }
    for (const c of cups) {
      if (!c.got && Math.abs(c.x - cxMid) < 18 && Math.abs(c.y - (p.y + PH / 2)) < 26) {
        c.got = true; caf = Math.min(100, caf + 35); sfx("cup"); burst(c.x, c.y, "#C98650", 8);
      }
    }

    for (const it of powItems) {
      if (!it.got && Math.abs(it.x - cxMid) < 18 && Math.abs(it.y - (p.y + PH / 2)) < 26) {
        it.got = true; sfx("power"); burst(it.x, it.y, POWCOL[it.k], 14); addRing(it.x, it.y, POWCOL[it.k]);
        if (it.k === "espresso") { p.espresso = 480; caf = 100; addPopup(it.x, it.y - 14, "ESPRESSO!", POWCOL.espresso, 1.1); }
        if (it.k === "shield") { p.shield = true; addPopup(it.x, it.y - 14, "SHIELD!", POWCOL.shield, 1.1); }
        if (it.k === "charm") { p.charm = true; addPopup(it.x, it.y - 14, "VINE CHARM!", POWCOL.charm, 1.1); }
      }
    }

    for (const r of ribItems) {
      if (!r.got && Math.abs(r.x - cxMid) < 18 && Math.abs(r.y - (p.y + PH / 2)) < 26) {
        r.got = true; save.rib[r.k] = true; persist(); addScore(200); sfx("power");
        burst(r.x, r.y, "#FF9AC1", 14); addRing(r.x, r.y, "#FF9AC1"); addPopup(r.x, r.y - 14, "RIBBON! +200", "#FF9AC1", 1.1);
      }
    }

    // Enemies
    for (const e of enemies) {
      if (e.dying) { e.dying--; if (e.dying === 0) e.dead = true; continue; }
      if (e.dead) continue;
      // Reactions: pigeons fly off when Capy gets close, snails pull into their shell
      if (e.k === "pigeon" && !e.fleeing && Math.abs(p.x - e.x) < 90) { e.fleeing = true; e.fdir = e.x < p.x ? -1 : 1; }
      if (e.fleeing) { e.x += e.fdir * 3; e.y -= 2.2; if (e.y < -60) e.dead = true; continue; }
      if (e.k === "snail" && !e.shell && Math.abs(p.x - e.x) < 70) { e.shell = true; e.shellT = 150; }
      if (e.shell && --e.shellT <= 0) e.shell = false;
      if (!e.shell) { e.x += e.v * e.dir; if (e.x < e.x0 || e.x > e.x1) e.dir *= -1; }
      if (e.bob) e.y = e.y0 + Math.sin(frame / 18 + e.x * 0.05) * e.bob;
      if (e.hop) e.y = e.y0 - Math.abs(Math.sin(frame / 22 + e.x * 0.03)) * e.hop;
      if (p.x < e.x + EW && p.x + PW > e.x && p.y < e.y + EH && p.y + PH > e.y) {
        if (!e.air && !e.spiky && p.vy > 0 && prevBottom <= e.y + 12) {
          stompEnemy(e);
        } else if (p.inv <= 0 && !e.shell) {
          hurt(); p.vy = -5; p.x -= p.face * 14;
        }
      }
    }

    if (mode !== "play") return;
    if (boss && boss.hp > 0) p.x = Math.max(ARENA[5], Math.min(s.goal - 20, p.x));   // stay in the arena
    if (p.x >= s.goal && !(boss && boss.hp > 0)) { completeStage(); return; }

    const camTarget = p.x - VIEW_W / 2 + PW / 2 + p.face * (p.running ? 60 : 30);
    cam += (Math.max(0, Math.min(s.len - VIEW_W, camTarget)) - cam) * 0.12;
    p.sq += (1 - p.sq) * 0.2;
    if (p.on && p.running && frame % 4 === 0) parts.push({ x: p.x + (p.face > 0 ? 4 : 24), y: GY - 2, vx: -p.face * 0.8, vy: -0.6, life: 18, c: "#E8DCC8" });
    shake *= 0.85; if (shake < 0.5) shake = 0;
    if (flashT > 0) flashT--;
    if (toast && toast.t > 0) toast.t--;
    parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life--; });
    parts = parts.filter(q => q.life > 0);
    stepT += p.on && Math.abs(p.vx) > 0 ? (p.running ? 0.45 : 0.25) : 0;
    if (p.on && (p.running || p.espresso > 0) && frame % 2 === 0) trail.push({ x: p.x + PW / 2 - p.face * 12, y: p.y + 14 + Math.random() * 22, life: 12, len: 14 + Math.random() * 12 });
    trail.forEach(q => q.life--); trail = trail.filter(q => q.life > 0);
    popups.forEach(q => { q.t--; q.y -= 0.5; }); popups = popups.filter(q => q.t > 0);
    rings.forEach(q => q.life--); rings = rings.filter(q => q.life > 0);
    updateHud();
  }

  function startPound() {
    p.pounding = true; p.vy = 15; p.sq = 0.85;
    sfx("dash");
    burst(p.x + PW / 2, p.y + PH, "#E8DCC8", 5);
  }
  // Slam down: shockwave, and every ground enemy nearby is knocked out
  function groundPound() {
    const cx = p.x + PW / 2;
    shake = 12; sfx("bounce");
    addRing(cx, GY, "#FFD23F"); addRing(cx, GY, "#FFF4DC");
    burst(cx, GY - 4, "#E8DCC8", 14);
    let hits = 0;
    for (const e of enemies) {
      if (e.dead || e.dying || e.fleeing || e.y < GY - 60 || Math.abs(e.x + 15 - cx) > 50) continue;
      e.dying = 24; hits++; addScore(100); burst(e.x + 15, e.y + 10, "#FFF4DC", 8);
    }
    if (hits) addPopup(cx, GY - 40, "POUND! x" + hits, "#FF8AD8", 1.1);
  }

  // ---------- Jax boss fight: three stomps while he is down ----------
  function startBoss() {
    boss = { x: ARENA[5] + 100, y: 60, w: 76, h: 48, hp: 3, mode: "fly", t: 0, stun: 0, bombT: 60, flash: 0 };
    toast = { text: "JAX APPEARS!", t: 120 };
    shake = 6; sfx("checkpoint");
  }
  function explodeBomb(bo) {
    shake = 10; addRing(bo.x, GY, "#3A1E12");
    burst(bo.x, GY - 6, "#FF9A3C", 14);
    if (p.on && Math.abs(p.x + PW / 2 - bo.x) < 30) hurt();
  }
  function slam(b) {
    shake = 14; sfx("bounce");
    addRing(b.x + b.w / 2, GY, "#FFD23F"); burst(b.x + b.w / 2, GY - 4, "#E8DCC8", 16);
    if (p.on && Math.abs(p.x + PW / 2 - (b.x + b.w / 2)) < 60) hurt();
  }
  function defeatBoss() {
    bombs = [];
    shake = 16; addScore(1000);
    addRing(boss.x + boss.w / 2, GY - 20, "#FFD23F");
    burst(boss.x + boss.w / 2, GY - 20, "#FFD23F", 24);
    toast = { text: "JAX DEFEATED!", t: 150 };
    save.beat = true; persist();
  }
  function updateBoss(prevBottom) {
    const b = boss;
    if (b.hp <= 0) return;
    const rage = 3 - b.hp;                          // Jax gets faster after every hit
    b.t++; if (b.flash > 0) b.flash--;
    if (b.mode === "fly") {
      b.x = Math.max(ARENA[5] - 20, Math.min(ARENA[5] + 220, b.x + Math.sin(frame / 40) * 1.5));
      b.y = 60 + Math.sin(frame / 25) * 6;
      if (--b.bombT <= 0) { bombs.push({ x: p.x + PW / 2, y: b.y + 36, vy: 0 }); b.bombT = Math.max(50, 100 - rage * 20); }
      if (b.t > 200) { b.mode = "dive"; b.t = 0; }
    } else if (b.mode === "dive") {
      const tx = p.x + PW / 2 - b.w / 2, sp = 2.2 + rage * 0.6;
      b.x += Math.max(-sp, Math.min(sp, tx - b.x));
      b.y = Math.min(GY - b.h, b.y + 4 + rage);
      if (b.y >= GY - b.h) { b.y = GY - b.h; b.mode = "stun"; b.t = 0; b.stun = Math.max(50, 90 - rage * 15); slam(b); }
    } else if (b.mode === "stun") {
      if (--b.stun <= 0) { b.mode = "fly"; b.t = 0; b.bombT = 60; b.y = 60; }
    }

    // Stomping Jax while he is down
    if (p.x < b.x + b.w && p.x + PW > b.x && p.y < b.y + b.h && p.y + PH > b.y) {
      if (b.mode === "stun" && p.vy > 0 && prevBottom <= b.y + 12) {
        b.hp--; b.flash = 20; p.vy = JUMP * 0.6; p.on = false;
        sfx("stomp"); shake = 10; addScore(500);
        burst(b.x + b.w / 2, b.y, "#FFD23F", 16);
        if (b.hp <= 0) defeatBoss();
        else { toast = { text: "JAX HIT! " + b.hp + " LEFT", t: 90 }; b.mode = "fly"; b.t = 0; b.bombT = 60; b.y = 60; }
      } else if (p.inv <= 0) { hurt(); p.vy = -5; p.x -= p.face * 14; }
    }

    // Bombs fall, explode on the ground, or hit Capy in the air
    for (const bo of bombs) { bo.vy += 0.35; bo.y += bo.vy; }
    bombs = bombs.filter(bo => {
      if (bo.y >= GY - 8) { explodeBomb(bo); return false; }
      if (Math.abs(p.x + PW / 2 - bo.x) < 16 && p.y < bo.y + 8 && p.y + PH > bo.y - 8) { hurt(); return false; }
      return true;
    });
  }

  // ---------- Idle animations: dozing with an orange, a remote control car, or a soda and a burp ----------
  const IDLE_KINDS = ["doze", "rc", "soda"];
  const IDLE_LEN = { doze: 420, rc: 540, soda: 300 };
  function updateIdle(dirKey) {
    const busy = dirKey || !p.on || p.climb || p.pounding || keys.jumpPressed || keys.downPressed || keys.up || keys.down;
    if (busy) { p.idleT = 0; p.idleAnim = null; return; }
    p.idleT = (p.idleT || 0) + 1;
    if (!p.idleAnim && p.idleT >= 240) {          // 4 seconds of standing still
      const pool = IDLE_KINDS.filter(k => k !== p.lastIdle);
      p.idleAnim = pool[Math.floor(Math.random() * pool.length)];
      p.lastIdle = p.idleAnim; p.idleF = 0;
    }
    if (p.idleAnim) {
      const f = ++p.idleF, k = p.idleAnim;
      if (k === "doze" && f === 28) sfx("plop");
      if (k === "doze" && f > 60 && f < 380 && f % 110 === 0) sfx("snore");
      if (k === "rc" && f > 50 && f < 500 && f % 24 === 0) sfx("zip");
      if (k === "soda" && f > 50 && f < 150 && f % 22 === 0) sfx("gulp");
      if (k === "soda" && f === 185) { sfx("burp"); shake = Math.max(shake, 3); p.sq = 1.12; }
      if (f >= IDLE_LEN[k]) { p.idleAnim = null; p.idleT = 120; }   // next one starts 2 seconds later
    }
  }

  // Sprite-space helpers: points measured on Capy's 86x118 sprite, mapped to the drawn size
  function SP(px, py, dw, dh) { return [(px / 86 - 0.5) * dw, (py / 118 - 1) * dh]; }
  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

  function drawIdle(dw, dh) {
    const k = p.idleAnim; if (!k) return;
    const f = p.idleF;
    if (k === "doze") drawDoze(f, dw, dh);
    else if (k === "rc") drawRC(f, dw, dh);
    else drawSoda(f, dw, dh);
  }

  function drawDoze(f, dw, dh) {
    const [ex, ey] = SP(37, 27, dw, dh), [hx, hy] = SP(37, 4, dw, dh);
    const asleep = f > 24 && f < 395;
    // Eyelid: closes over the eye while he dozes
    if (asleep) {
      g.fillStyle = "#BD7544"; g.fillRect(ex - 3.5, ey - 3, 7, 6);   // matches the fur around his eye
      g.fillStyle = "#3A1E12"; g.fillRect(ex - 3.5, ey + 1, 7, 1.5);
    }
    // The orange drops onto his head, wobbles while he sleeps, and rolls off when he wakes
    const capOff = (save.look === "crown" || save.look === "flowers") ? 6 : 0;
    let ox = hx, oy = hy - 7 - capOff, rot = 0;
    if (f < 28) { const t = f / 28; oy = (hy - 7 - capOff) - (1 - t * t) * 90; }
    else if (f < 40) oy -= Math.abs(Math.sin((f - 28) / 12 * Math.PI)) * 4;
    else if (f < 395) { rot = Math.sin(f / 30) * 0.15; ox += Math.sin(f / 30) * 1.5; }
    else { const t = (f - 395) / 25; ox -= t * 26; oy += t * t * 60; rot = -t * 4; }
    if (f < 420) {
      g.save(); g.translate(ox, oy); g.rotate(rot);
      g.fillStyle = "#FF9A1F"; g.beginPath(); g.arc(0, 0, 7, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#FFC266"; g.beginPath(); g.arc(-2.5, -2.5, 2.2, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#B85F00"; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, 7, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#3F8E3A"; g.beginPath(); g.ellipse(2.5, -7.5, 3.5, 1.6, -0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#6B4A2A"; g.fillRect(-0.5, -9, 1.5, 3);
      g.restore();
    }
    // Floating Z's
    if (asleep && f > 50) {
      g.font = "8px 'Press Start 2P', monospace"; g.fillStyle = "#3A1E12";
      for (let i = 0; i < 3; i++) {
        const ph = ((f - 50 + i * 40) % 120) / 120;
        g.globalAlpha = 1 - ph;
        g.save(); g.translate(ex + 10 + ph * 14, ey - 18 - ph * 30); g.scale(p.face, 1); g.fillText(i === 1 ? "z" : "Z", 0, 0); g.restore();
      }
      g.globalAlpha = 1;
    }
  }

  function drawRC(f, dw, dh) {
    const [hx, hy] = SP(58, 64, dw, dh);
    // Remote in his front paw, antenna up, button blinking
    const up = ease(f / 25), gone = ease((f - 515) / 25);
    if (up > 0 && gone < 1) {
      g.save(); g.translate(hx + 2, hy + 6 * (1 - up) + 10 * gone); g.globalAlpha = 1 - gone;
      g.fillStyle = "#4A4A58"; g.fillRect(-4, -5, 9, 11);
      g.strokeStyle = "#1B1024"; g.lineWidth = 1; g.strokeRect(-4, -5, 9, 11);
      g.fillStyle = (Math.floor(frame / 8) % 2) ? "#FF5C7A" : "#7A2A3A"; g.fillRect(-2, -3, 3, 3);
      g.fillStyle = "#59C9FF"; g.fillRect(1.5, 1, 2, 2);
      g.strokeStyle = "#1B1024"; g.beginPath(); g.moveTo(3, -5); g.lineTo(6, -15); g.stroke();
      g.fillStyle = "#FF5C7A"; g.beginPath(); g.arc(6, -15, 1.5, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    // The car rolls out from behind him, zips back and forth in front, then drives back behind him
    if (f < 30) return;
    const t = f - 30;
    let cx, dir;
    if (t < 40) { cx = -30 + (t / 40) * 60; dir = 1; }
    else if (f < 495) {
      const ph = (t - 40) / 70;
      cx = 45 + Math.sin(ph) * 25; dir = Math.cos(ph) >= 0 ? 1 : -1;
    } else { const q = (f - 495) / 40; cx = 45 + Math.sin((455 - 40) / 70) * 25 - q * 90; dir = -1; }
    if (cx < -36) return;
    const behind = cx < -dw / 2 + 4;          // hidden behind his back at the start and end
    g.save(); g.translate(cx, -1);
    if (behind) g.globalAlpha = 0.35;
    g.scale(dir, 1);
    const bounce = Math.abs(Math.sin(frame / 3)) * 0.8;
    g.fillStyle = "#E0584A"; g.fillRect(-9, -8 - bounce, 18, 6);
    g.fillStyle = "#C2403A"; g.fillRect(-5, -12 - bounce, 9, 4);
    g.fillStyle = "#BFEFFF"; g.fillRect(-3, -11 - bounce, 5, 3);
    g.fillStyle = "#FFD23F"; g.fillRect(7, -7 - bounce, 2, 2);
    g.strokeStyle = "#1B1024"; g.lineWidth = 1; g.beginPath(); g.moveTo(-7, -12 - bounce); g.lineTo(-9, -17 - bounce); g.stroke();
    const spin = frame / 2;
    for (const wx of [-5, 5]) {
      g.fillStyle = "#1B1024"; g.beginPath(); g.arc(wx, -2, 2.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#8A8A9A"; g.fillRect(wx + Math.cos(spin) * 1.2 - 0.5, -2 + Math.sin(spin) * 1.2 - 0.5, 1, 1);
    }
    if (frame % 6 < 3) { g.fillStyle = "rgba(200,200,200,0.7)"; g.beginPath(); g.arc(-12, -4, 2 + Math.random(), 0, Math.PI * 2); g.fill(); }
    g.restore();
    // Radio waves from the remote to the car
    if (!behind && f > 70 && f < 495) {
      g.strokeStyle = "rgba(89,201,255,0.7)"; g.lineWidth = 1;
      for (let i = 0; i < 2; i++) {
        const r = 4 + ((frame + i * 10) % 20) * 0.5;
        g.beginPath(); g.arc(hx + 8, hy - 15, r, -0.9, 0.3); g.stroke();
      }
    }
  }

  function drawSoda(f, dw, dh) {
    const [hx, hy] = SP(58, 64, dw, dh), [mx, my] = SP(70, 44, dw, dh);
    // Bottle comes up from his paw to his mouth, tips bottoms-up, then he tosses it
    let bx, by, ang, alpha = 1;
    if (f < 25) { const t = ease(f / 25); bx = hx + 4; by = hy + 10 * (1 - t); ang = 0; alpha = t; }
    else if (f < 50) { const t = ease((f - 25) / 25); bx = hx + 4 + (mx + 3 - hx - 4) * t; by = hy + (my - 6 - hy) * t; ang = -2.3 * t; }
    else if (f < 150) { bx = mx + 3; by = my - 6 + Math.sin(f / 6) * 0.6; ang = -2.3 - Math.sin(f / 20) * 0.1; }
    else if (f < 175) { const t = (f - 150) / 25; bx = mx + 3 + t * 30; by = my - 6 - Math.sin(t * Math.PI) * 30 + t * 40; ang = -2.3 + t * 6; alpha = 1 - t; }
    if (bx !== undefined) {
      const level = f < 50 ? 1 : Math.max(0, 1 - (f - 50) / 100);
      g.save(); g.translate(bx, by); g.rotate(ang); g.globalAlpha = alpha;
      g.fillStyle = "rgba(160,230,190,0.55)"; g.fillRect(-4, -6, 8, 14);
      g.fillStyle = "#4FB86E"; g.fillRect(-4, -6 + 14 * (1 - level), 8, 14 * level);
      g.fillStyle = "rgba(160,230,190,0.55)"; g.fillRect(-2, -12, 4, 6);
      g.fillStyle = "#E0584A"; g.fillRect(-2.5, -13, 5, 2);
      g.fillStyle = "#FFF4DC"; g.fillRect(-4, -1, 8, 4);
      g.strokeStyle = "rgba(27,16,36,0.6)"; g.lineWidth = 1; g.strokeRect(-4, -6, 8, 14);
      g.restore();
      // Fizz while he drinks
      if (f > 50 && f < 150) {
        g.fillStyle = "rgba(255,255,255,0.85)";
        for (let i = 0; i < 3; i++) { const ph = ((f + i * 9) % 26) / 26; g.fillRect(mx - 2 + Math.sin(i * 2 + f / 5) * 3, my - 6 - ph * 12, 1.5, 1.5); }
      }
    }
    // The burp
    if (f >= 185 && f < 290) {
      const t = (f - 185) / 105, s = 0.6 + Math.min(1, t * 6) * 0.5;
      g.save(); g.translate(mx + 18 + t * 8, my - 14 - t * 10); g.globalAlpha = Math.min(1, (1 - t) * 3);
      g.scale(p.face * s, s);
      g.fillStyle = "rgba(190,240,170,0.9)";
      g.beginPath(); g.arc(-10, 2, 7, 0, Math.PI * 2); g.arc(0, -2, 9, 0, Math.PI * 2); g.arc(11, 2, 7, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#3A1E12"; g.font = "7px 'Press Start 2P', monospace"; g.textAlign = "center";
      g.fillText("BURP!", 0, 4); g.textAlign = "left";
      g.restore();
      g.strokeStyle = `rgba(190,240,170,${0.8 * (1 - t)})`; g.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(mx + 4, my, 4 + t * 18 + i * 4, -0.7, 0.7); g.stroke(); }
    }
  }

  // ---------- Points, combos and effects ----------
  function addScore(pts) { score += pts; }
  function addPopup(x, y, text, c, s = 1) { popups.push({ x, y, text, c, s, t: 40, max: 40 }); }
  function addRing(x, y, c) { rings.push({ x, y, c, life: 22, max: 22 }); }

  // Stomp: 100 points, doubling with each stomp in the same air chain (200, 400, 800...)
  function stompEnemy(e) {
    e.dying = 24;
    combo++;
    const pts = 100 * Math.pow(2, Math.min(combo - 1, 4));
    addScore(pts);
    p.vy = JUMP * 0.6; p.on = false; p.sq = 1.2;
    sfx("stomp");
    const cx = e.x + 15, cy = e.y + 10;
    addRing(cx, cy, "#FFF4DC");
    addRing(cx, cy, "#FFD23F");
    burst(cx, cy, "#FFF4DC", 12);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5 - 1, life: 26, max: 26, c: "#FFD23F", star: true });
    }
    addPopup(cx, cy - 20, "+" + pts, "#FFD23F", 1);
    if (combo >= 2) addPopup(cx, cy - 36, "x" + combo + " COMBO!", "#FF8AD8", 1.1);
    shake = Math.max(shake, 4);
    hitStop = 4; vibrate(15);
  }

  function drawPopups() {
    g.textAlign = "center";
    for (const q of popups) {
      const age = 1 - q.t / q.max;
      const sc = q.s * (age < 0.2 ? 0.6 + age * 2 : 1);
      g.save();
      g.globalAlpha = Math.min(1, q.t / 12);
      g.translate(q.x, q.y); g.scale(sc, sc);
      g.font = "8px 'Press Start 2P', monospace";
      g.fillStyle = "#3A1E12"; g.fillText(q.text, 1, 1);
      g.fillStyle = q.c; g.fillText(q.text, 0, 0);
      g.restore();
    }
  }

  function drawRings() {
    for (const q of rings) {
      const a = q.life / q.max, r = (1 - a) * 26 + 4;
      g.globalAlpha = a; g.strokeStyle = q.c; g.lineWidth = 3;
      g.beginPath(); g.arc(q.x, q.y, r, 0, Math.PI * 2); g.stroke();
    }
    g.globalAlpha = 1;
  }

  // Speed lines behind Capy while dashing
  function drawTrail() {
    g.strokeStyle = "#FFFFFF"; g.lineWidth = 2;
    for (const q of trail) {
      g.globalAlpha = (q.life / 12) * 0.7;
      g.beginPath(); g.moveTo(q.x, q.y); g.lineTo(q.x - p.face * q.len, q.y); g.stroke();
    }
    g.globalAlpha = 1;
  }

  // ---------- Drawing helpers ----------
  // Parallax layer: scrolls at `factor` of the camera speed
  function layer(factor, spacing, fn) {
    const k0 = Math.floor((factor * cam - 400) / spacing), k1 = Math.ceil((factor * cam + VIEW_W + 400) / spacing);
    for (let k = k0; k <= k1; k++) fn(k, k * spacing + cam * (1 - factor));
  }

  function drawSky(s) {
    const grad = g.createLinearGradient(0, -400, 0, GY);
    grad.addColorStop(0, s.sky[0]); grad.addColorStop(1, s.sky[1]);
    g.fillStyle = grad; g.fillRect(-10, -1000, VIEW_W + 20, 1000 + GY);   // screen space: covers the whole view
  }

  function drawBackdrop() {
    g.fillStyle = "rgba(40,20,60,0.14)";
    layer(0.2, 300, (k, wx) => { g.beginPath(); g.ellipse(wx + 150, GY - 20, 200, 110, 0, Math.PI, 2 * Math.PI); g.fill(); });
    g.fillStyle = "rgba(255,255,255,0.55)";
    layer(0.1, 230, (k, wx) => {
      const x = wx + frame * 0.05, y = 36 + ((k % 3 + 3) % 3) * 22;
      g.beginPath(); g.arc(x, y, 16, 0, Math.PI * 2); g.arc(x + 18, y - 6, 20, 0, Math.PI * 2); g.arc(x + 40, y, 15, 0, Math.PI * 2); g.fill();
    });
  }

  // ---------- Scenery: animated backgrounds per stage ----------
  function drawDeco(s) {
    const t = s.theme, f = frame;
    if (t === "city") {
      const palette = ["#B7A7C9", "#A896BE", "#C6B4D8", "#9C8AB3"];
      const signs = ["#FF5C7A", "#5BE37A", "#59C9FF", "#FFD23F"];
      layer(0.5, 140, (k, wx) => {
        const hsh = Math.abs(Math.sin(k * 91.7) * 1000) % 1;
        const h = 90 + Math.floor(hsh * 80);
        g.fillStyle = palette[Math.abs(k) % 4]; g.fillRect(wx, GY - h, 118, h + 200);
        g.fillStyle = "rgba(40,20,60,0.35)"; g.fillRect(wx - 4, GY - h - 6, 126, 8);
        // Antenna with a blinking red light
        g.fillStyle = "#3A1E12"; g.fillRect(wx + 100, GY - h - 16, 2, 10);
        g.fillStyle = (Math.floor(f / 30) + k) % 2 ? "#FF5C7A" : "#5A2A3A"; g.fillRect(wx + 99, GY - h - 18, 4, 4);
        // Windows flicker on and off
        for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
          const lit = Math.abs(Math.sin((k * 7 + r * 3 + c) * 12.3 + Math.floor(f / 90) * 0.7)) > 0.35;
          g.fillStyle = lit ? "#FFF4C2" : "#6E5A8A";
          g.fillRect(wx + 14 + c * 32, GY - h + 12 + r * 22, 12, 14);
        }
        // Striped awning and a neon sign that blinks
        const awn = Math.abs(k) % 2 ? "#FF5C7A" : "#5BE37A";
        for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? "#FFF4DC" : awn; g.fillRect(wx + 4 + i * 19, GY - 34, 19, 10); }
        const on = (Math.floor(f / 25) + Math.abs(k)) % 3 !== 0;
        g.fillStyle = on ? signs[Math.abs(k) % 4] : "#4A3A5C";
        g.fillRect(wx + 12, GY - 50, 62, 12);
        g.fillStyle = "#3A1E12"; g.fillRect(wx + 18, GY - 46, 50, 3);
        if (on) { g.fillStyle = "rgba(255,255,255,0.12)"; g.fillRect(wx + 10, GY - 52, 66, 16); }
      });
    } else if (t === "cellar") {
      layer(0.5, 80, (k, wx) => {
        for (let r = 0; r < 6; r++) { g.fillStyle = r % 2 ? "#3E3440" : "#362C3A"; g.fillRect(wx + (r % 2 ? 40 : 0), 20 + r * 26, 78, 24); }
      });
      layer(0.5, 240, (k, wx) => {
        const flick = Math.sin(frame / 4 + k) * 2;
        g.fillStyle = "#5A4A3A"; g.fillRect(wx + 60, 80, 6, 16);
        g.fillStyle = "#FFB347"; g.beginPath(); g.ellipse(wx + 63, 78 + flick, 5, 8, 0, 0, Math.PI * 2); g.fill();
      });
    } else if (t === "marsh") {
      // Reeds sway in the breeze
      layer(0.7, 80, (k, wx) => {
        for (let i = 0; i < 3; i++) {
          const x = wx + 20 + i * 8, lean = Math.sin(f / 30 + k + i) * 3;
          g.strokeStyle = "#2F6B56"; g.lineWidth = 2.5;
          g.beginPath(); g.moveTo(x, GY); g.quadraticCurveTo(x + lean * 0.5, GY - 30, x + lean, GY - 60 - i * 6); g.stroke();
          g.fillStyle = "#6B3A22"; g.beginPath(); g.ellipse(x + lean, GY - 60 - i * 6 + 4, 2.5, 6, 0, 0, Math.PI * 2); g.fill();
        }
      });
    } else if (t === "sun") {
      // Sun with slowly turning rays and a soft glow
      const sx = 380 - cam * 0.1, sy = 70;
      const glow = g.createRadialGradient(sx, sy, 20, sx, sy, 110);
      glow.addColorStop(0, "rgba(255,240,176,0.55)"); glow.addColorStop(1, "rgba(255,240,176,0)");
      g.fillStyle = glow; g.fillRect(sx - 120, sy - 120, 240, 240);
      g.fillStyle = "#FFF0B0"; g.beginPath(); g.arc(sx, sy, 36, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "rgba(255,240,176,0.6)"; g.lineWidth = 3;
      for (let a = 0; a < 12; a++) {
        const q = a * Math.PI / 6 + f / 120;
        g.beginPath(); g.moveTo(sx + Math.cos(q) * 44, sy + Math.sin(q) * 44); g.lineTo(sx + Math.cos(q) * 60, sy + Math.sin(q) * 60); g.stroke();
      }
    } else if (t === "festival") {
      // Bunting that sways, floating balloons
      const cols = ["#FF5C7A", "#FFD23F", "#5BE37A", "#59C9FF"];
      for (let i = 0; i < 12; i++) {
        const x0 = i * 80 - (cam * 0.6) % 80;
        const sway = Math.sin(f / 25 + i) * 6;
        g.strokeStyle = "#3A1E12"; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(x0, 30); g.quadraticCurveTo(x0 + 40, 60 + sway, x0 + 80, 30); g.stroke();
        for (let k = 0; k < 3; k++) {
          g.fillStyle = cols[(i + k) % 4];
          const bx = x0 + 20 + k * 20, by = 40 + Math.sin(f / 25 + i + k * 0.5) * 2;
          g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + 8, by); g.lineTo(bx + 4, by + 12); g.fill();
        }
      }
      for (let i = 0; i < 5; i++) {
        const x = cam + ((i * 130 + f * 0.25) % (VIEW_W + 200)) - 100;
        const y = 120 + i * 14 + Math.sin(f / 40 + i) * 8;
        g.fillStyle = cols[(i + 2) % 4]; g.beginPath(); g.ellipse(x, y, 9, 11, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "rgba(58,30,18,0.6)"; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y + 11); g.lineTo(x + 3, y + 26); g.stroke();
      }
    } else if (t === "jungle") {
      // Canopy that sways
      layer(0.4, 130, (i, x) => {
        const sway = Math.sin(f / 40 + i) * 4;
        g.fillStyle = "#2E5E2A"; g.fillRect(x + 40, 80, 18, GY - 80);
        g.fillStyle = "#3F8E3A"; g.beginPath(); g.arc(x + 49 + sway, 80, 40, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#4FA84A"; g.beginPath(); g.arc(x + 30 + sway, 70, 20, 0, Math.PI * 2); g.fill();
      });
    } else if (t === "rooftop") {
      // Soft clouds and rooftop steam vents
      g.fillStyle = "rgba(255,255,255,0.6)";
      layer(0.2, 170, (i, x) => { g.beginPath(); g.arc(x, 50, 18, 0, Math.PI * 2); g.arc(x + 20, 44, 22, 0, Math.PI * 2); g.arc(x + 42, 52, 16, 0, Math.PI * 2); g.fill(); });
      const v0 = Math.max(0, Math.floor((cam - 100) / 320)), v1 = Math.ceil((cam + VIEW_W + 100) / 320);
      for (let i = v0; i <= v1; i++) {
        const vx = 240 + i * 320;
        for (let j = 0; j < 3; j++) {
          const age = ((f + j * 30 + i * 17) % 90) / 90;
          g.fillStyle = `rgba(255,255,255,${0.35 * (1 - age)})`;
          g.beginPath(); g.arc(vx + Math.sin(age * 6 + i) * 5, GY - 6 - age * 40, 3 + age * 5, 0, Math.PI * 2); g.fill();
        }
      }
    }
  }

  // Moving life: birds, dragonflies, fish, leaves, fireflies, confetti, sparkles
  function drawAmbient(s) {
    const t = s.theme, f = frame;
    const flap = (x, y, w, c) => {
      const d = Math.sin(f / 4 + x) * w * 0.6;
      g.strokeStyle = c; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x - w, y - d); g.lineTo(x, y); g.lineTo(x + w, y - d); g.stroke();
    };
    if (t === "city") {
      for (let i = 0; i < 3; i++) {
        const x = cam + ((i * 210 + f * 0.7) % (VIEW_W + 300)) - 150;
        flap(x, 70 + i * 18 + Math.sin(f / 20 + i) * 4, 6, "#3A1E12");
      }
    } else if (t === "marsh") {
      for (let i = 0; i < 4; i++) {
        const x = cam + 60 + i * 120 + Math.sin(f / 30 + i) * 40, y = 110 + Math.sin(f / 17 + i * 2) * 12;
        g.fillStyle = "rgba(255,255,255,0.7)";
        g.beginPath(); g.ellipse(x - 2, y - 3, 4, 2, -0.4, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(x + 2, y - 3, 4, 2, 0.4, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#2F6B56"; g.fillRect(x - 6, y - 1, 12, 2);
      }
      // Fish leap from the water
      for (let j = 0; j < plats.length + STAGES[si].pits.length; j++) {
        const pit = STAGES[si].pits[j % STAGES[si].pits.length];
        if (!pit) continue;
        const ph = (f + j * 70) % 200;
        if (ph < 44) {
          const px = pit[0] + pit[1] / 2 + Math.sin(j) * 10, py = GY + 6 - Math.sin(ph / 44 * Math.PI) * 30;
          g.fillStyle = "#FF9A3C"; g.beginPath(); g.ellipse(px, py, 5, 2.6, 0, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "rgba(255,255,255,0.7)"; g.lineWidth = 1.2;
          g.beginPath(); g.ellipse(px, GY + 6, 9 + ph / 8, 2.5, 0, 0, Math.PI * 2); g.stroke();
        }
      }
    } else if (t === "sun") {
      // Heat shimmer above the ground
      g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 1;
      for (let k = 0; k < 6; k++) {
        const y = GY - 14 - k * 3, x0 = cam + ((k * 90 + f * 0.3) % (VIEW_W + 200)) - 100;
        g.beginPath();
        for (let i = 0; i <= 14; i++) { const x = x0 + i * 8, yy = y + Math.sin(f / 9 + i + k) * 1.5; i ? g.lineTo(x, yy) : g.moveTo(x, yy); }
        g.stroke();
      }
      for (let i = 0; i < 2; i++) flap(cam + ((i * 260 + f * 0.8) % (VIEW_W + 300)) - 150, 52 + i * 22, 5, "#7A3B2E");
      for (let i = 0; i < 8; i++) {
        const x = cam + ((i * 67 + f * 0.2) % VIEW_W), y = GY - ((f * 0.4 + i * 37) % 160);
        g.fillStyle = "rgba(255,230,160,0.8)"; g.fillRect(x, y, 2, 2);
      }

  // Underground: layered soil, stones and roots fill the bottom of the screen
